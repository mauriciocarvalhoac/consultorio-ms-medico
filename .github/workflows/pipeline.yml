name: Pipeline CI/CD - Paciente

on:
  push:
    branches: [ main, deploy, feature/sprint001/001-configuracao-pipeline-ci-cd ]

jobs:
  config-app:
    runs-on: ubuntu-latest
    steps:
      - name: Configuração do projeto
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven

      - name: Build e Testes com Maven
        run: |
          echo "Executando os testes unitários"
          mvn -B test
          echo "Testes unitários executados com sucesso!!"

      - name: Build with Maven
        run: |
          echo "Buildando a aplicação"
          mvn clean install -DskipTests
          echo "Build concluído com Sucesso!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/consultorio-ms-medico.jar

  deploy_vps:
    needs: config-app
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: Faz o Deploy para VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 76.13.164.100
          username: root
          key: ${{ secrets.VPS_SSH }}
          port: 22
          source: "consultorio-ms-medico.jar"
          target: "/app/project-ms/medico"
          debug: true
          overwrite: true

  deploy_docker_hub:
    needs: config-app
    runs-on: ubuntu-latest
    steps:
      - name: Configuração do projeto
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      # Login no Docker Hub
      - name: Login do DockerHub
        uses: docker/login-action@v3
        with:
          username: mauriciocarvalhoac
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push da Imagem para o DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mauriciocarvalhoac/consultorio-ms-medico:latest
            mauriciocarvalhoac/consultorio-ms-medico:${{ github.sha }}
